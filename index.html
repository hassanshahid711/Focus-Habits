<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Focus & Habits</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fafaf8;--card:#fff;--text:#1d1d1b;--mute:#76766f;--acc:#2f6f5e;--on:#fff;--line:#e6e6e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#121413;--card:#1b1e1d;--text:#ecece8;--mute:#8d928e;--acc:#6fcfb0;--on:#0c1411;--line:#2a2e2c;color-scheme:dark}}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{--bg:#121413;--card:#1b1e1d;--text:#ecece8;--mute:#8d928e;--acc:#6fcfb0;--on:#0c1411;--line:#2a2e2c;color-scheme:dark}
:root[data-theme=sepia]{--bg:#f4ecd8;--card:#fbf5e6;--text:#3b3226;--mute:#8a7b64;--acc:#a0522d;--on:#fff;--line:#e3d7ba}
:root[data-theme=forest]{--bg:#16211b;--card:#1d2b24;--text:#e4ede7;--mute:#8aa395;--acc:#8fd19e;--on:#0e1a13;--line:#2a3d33;color-scheme:dark}
:root[data-theme=ocean]{--bg:#eef4f8;--card:#fff;--text:#14293a;--mute:#6b8294;--acc:#1f6fa8;--on:#fff;--line:#d9e4ec}
:root[data-theme=rose]{--bg:#fbf1f2;--card:#fff;--text:#3a2226;--mute:#94707a;--acc:#b8475f;--on:#fff;--line:#f0dde0}
:root[data-theme=mono]{--bg:#fff;--card:#fff;--text:#000;--mute:#777;--acc:#000;--on:#fff;--line:#ddd}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100%}
.w{max-width:560px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:17px;margin:0;font-weight:650}h2{font-size:13px;margin:18px 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--acc);color:var(--on)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
button,select,input{font:inherit;color:var(--text)}
select,input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input[type=text]{width:100%}
.b{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.g{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.g.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.clk{font-size:64px;font-weight:300;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:6px 0}
.m{color:var(--mute);font-size:13px}.c{text-align:center}
.nudge{border-left:3px solid var(--acc);padding:6px 10px;background:var(--bg);border-radius:6px;margin:8px 0;font-size:14px}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.dots i.f{background:var(--acc)}.dots i.m{background:color-mix(in srgb,var(--acc) 50%,var(--line))}.dots i.x{background:transparent;border:1px dashed var(--mute)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.hm i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.s{font-weight:650;color:var(--acc)}
.sh{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;margin:12px 0 8px;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
#fm{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#fm .clk{font-size:96px}
#dlg{position:fixed;inset:0;background:#0006;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}
#dlg>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px}
details summary{cursor:pointer;font-weight:600;color:var(--acc)}
p{margin:6px 0}ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
</style></head><body>
<div class="w">
<header><h1>Focus &amp; Habits</h1>
<select id="th" aria-label="Theme" onchange="setTh(this.value)"><option value="auto">Auto</option><option>light</option><option>dark</option><option>sepia</option><option>forest</option><option>ocean</option><option>rose</option><option>mono</option></select></header>
<nav id="nv"></nav><div id="v"></div></div>
<div id="fm"><div class="m" id="fmt"></div><div class="clk" id="fmc"></div><button class="g" onclick="$('#fm').style.display='none'">Exit focus mode</button></div>
<div id="dlg"><div><p id="dq"></p><input type="text" id="di"><div class="row"><button class="b" onclick="dOk()">Save</button><button class="g" onclick="$('#dlg').style.display='none'">Cancel</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={subjects:['Study','Work'],sessions:[],habits:[],logs:{},points:0,theme:'auto',focus:25,brk:5,identity:'',refl:[],intent:'',energy:2,subj:'Study',col:{}};
try{const r=localStorage.getItem('fh1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('fh1',JSON.stringify(S))}catch(e){}};
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const pos=v=>v&&v[0]!=='x';
const dayOf=s=>dk(new Date(s.t));
let tab='f',T={ph:'idle',run:false,end:0,left:0,tot:0,intr:0,lost:0,hid:0,tip:''},open={},dcb=null;
function setTh(v){S.theme=v;apply();save()}
function apply(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);$('#th').value=S.theme}
function ask(q,cb){$('#dq').textContent=q;$('#di').value='';$('#dlg').style.display='flex';dcb=cb;setTimeout(()=>$('#di').focus(),50)}
function dOk(){const v=$('#di').value.trim();$('#dlg').style.display='none';if(v&&dcb)dcb(v)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.08;o.frequency.value=660;o.start();o.stop(a.currentTime+.35)}catch(e){}}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

/* ---------- Habits logic ---------- */
function streak(h){const L=S.logs[h.id]||{};if(L[dk()]&&L[dk()][0]==='x')return 0;let n=0,i=pos(L[dk()])?0:1;for(;;i++){if(pos(L[dk(ago(i))]))n++;else break}return n}
function target(h){if(!h.tm)return 0;const w=Math.floor((Date.now()-h.created)/6048e5);let ok=0;const L=S.logs[h.id]||{};for(let k=0;k<w;k++){let c=0;for(let d=0;d<7;d++)if(pos(L[dk(new Date(h.created+(k*7+d)*864e5))]))c++;if(c>=5)ok++}return h.tm+ok*(h.step||5)}
function setLog(id,v){const L=S.logs[id]=S.logs[id]||{},k=dk(),o=L[k];if(o==='f')S.points-=10;else if(o==='m')S.points-=5;if(v===null||o===v)delete L[k];else{L[k]=v;if(v==='f')S.points+=10;else if(v==='m')S.points+=5}S.points=Math.max(0,S.points);delete open[id];save();R()}
function autoCheck(){S.habits.forEach(h=>{if(!h.link)return;const L=S.logs[h.id]=S.logs[h.id]||{};if(L[dk()]==='f')return;const n=S.sessions.filter(s=>s.subj===h.link&&dayOf(s)===dk()&&!s.early&&s.done!==0).length;if(n>=(h.ln||1)){L[dk()]='f';S.points+=10}});save()}
function addHabit(){D=null;const g=i=>$('#'+i).value.trim();if(!g('hn'))return;S.habits.push({id:Date.now(),name:g('hn'),full:g('hf')||'Full version',min:g('hm')||'Tiny version',after:+$('#ha').value||null,link:$('#hl').value||null,ln:+g('hk')||1,tm:+g('ht')||0,step:+g('hs')||5,created:Date.now()});save();R()}
let D=null,tc=0,seq=0;
function sec(id,t,h,d){S.col=S.col||{};const c=S.col[id]===undefined?!!d:S.col[id];return `<div><button class="sh" onclick="tg('${id}')"><span>${t}</span><span>${c?'▸':'▾'}</span></button>${c?'':h}</div>`}
function tg(id){S.col=S.col||{};const c=S.col[id]===undefined?false:S.col[id];S.col[id]=!c;save();R()}
const P=a=>({n:a[0],f:a[1],m:a[2],tm:a[3],step:5,link:a[4],ln:a[5],after:a[6]});
const TPL=[
{c:'Study',i:[['Study session','2 hours of focused study','Open the book for 5 minutes',0,'Study',3,''],['Practice questions','Complete 10 practice questions under timed conditions','Do 1 practice question',0,'',1,''],['Review notes','Review and summarise one topic from your notes','Skim one page of notes',0,'',1,''],['Flashcards','Review 20 flashcards','Review 5 flashcards',0,'',1,''],['Error log','Log and fix the mistakes from today','Log one mistake',0,'',1,'']]},
{c:'Mindful',i:[['Meditation or prayer','10 minutes of meditation or prayer','Take 5 slow breaths',0,'',1,''],['Gratitude journal','Write 3 things you are grateful for','Write 1 thing',0,'',1,'Meditation or prayer'],['Inspiring reading','Read one page of an inspiring or spiritual text','Read one line',0,'',1,''],['Evening wind-down','15 minutes screen-free wind-down','Put the phone away for 5 minutes',0,'',1,'']]},
{c:'Health',i:[['Walk','30-minute walk','10-minute walk',0,'',1,''],['Workout','45-minute workout','10 minutes of stretching',0,'',1,''],['Water','8 glasses of water','4 glasses of water',0,'',1,''],['Sleep on time','In bed by 11 pm','Phone away by 11:30 pm',0,'',1,'']]},
{c:'Career',i:[['Job applications','Apply to 3 roles','Tailor one application',0,'',1,''],['Skill practice','45 minutes of deliberate skill practice','Watch a 10-minute tutorial',0,'',1,''],['Language practice','30 minutes of practice','10 minutes of practice',0,'',1,''],['Creative project','Work on a side project or create one piece of content','Write down one idea',0,'',1,'']]},
{c:'Daily',i:[['Plan tomorrow','Write the top 3 tasks for tomorrow','Write 1 top task',0,'',1,''],['Read','Read 20 pages','Read 1 page',0,'',1,''],['Evening review','Review the day and note one lesson','Note one win',0,'',1,'']]}
].map(c=>({c:c.c,i:c.i.map(P)}));
function addT(t){if(S.habits.some(h=>h.name===t.n))return;const a=S.habits.find(h=>h.name===t.after);S.habits.push({id:Date.now()+(seq++),name:t.n,full:t.f,min:t.m,after:a?a.id:null,link:t.link&&S.subjects.includes(t.link)?t.link:null,ln:t.ln||1,tm:t.tm||0,step:5,created:Date.now()})}
function useT(j){addT(TPL[tc].i[j]);save();R()}
function addAll(){TPL[tc].i.forEach(addT);save();R()}
function cust(j){D=TPL[tc].i[j];S.col.am=false;R();setTimeout(()=>{const e=$('#hn');if(e)e.scrollIntoView({block:'center'})},50)}
function tfill(v){const t=TPL.flatMap(c=>c.i).find(x=>x.n.toLowerCase()===v.trim().toLowerCase());if(!t)return;const s=(i,x)=>{const e=$('#'+i);if(e&&!e.value)e.value=x};s('hf',t.f);s('hm',t.m);if(t.link&&S.subjects.includes(t.link))$('#hl').value=t.link;if(t.ln>1)$('#hk').value=t.ln;const a=S.habits.find(h=>h.name===t.after);if(a)$('#ha').value=a.id}
function quick(){const c=TPL[tc],have=n=>S.habits.some(h=>h.name===n);return sec('qa','Quick add routines',`<div class="card"><div class="row" style="margin-top:0">${TPL.map((x,i)=>`<button class="g ${i===tc?'on':''}" onclick="tc=${i};R()">${x.c}</button>`).join('')}</div>${c.i.map((t,j)=>`<div class="top" style="padding:8px 0;border-top:1px solid var(--line)"><div><b>${esc(t.n)}</b><div class="m">${esc(t.f)} · tiny: ${esc(t.m)}</div></div><div class="row" style="margin:0;flex-wrap:nowrap">${have(t.n)?'<span class="m">Added</span>':`<button class="b" style="padding:6px 10px" onclick="useT(${j})">Add</button><button class="g" style="padding:5px 8px" onclick="cust(${j})">Edit</button>`}</div></div>`).join('')}<div class="row"><button class="g" onclick="addAll()">Add whole ${c.c.toLowerCase()} routine</button></div></div>`,S.habits.length?1:0)}
function reflect(id){ask('What got in the way, and what will you change?',v=>{const h=S.habits.find(x=>x.id===id);S.refl.push({t:Date.now(),id,v});h.carry=Math.max(0,(h.best||0)-3);h.rd=dk();save();R()})}
function delH(id){S.habits=S.habits.filter(h=>h.id!==id);delete S.logs[id];save();R()}
function hCard(h){const L=S.logs[h.id]||{},t=L[dk()],n=streak(h);if(n===0&&h.rd!==dk())h.carry=0;const sh=n+(h.carry||0);h.best=Math.max(h.best||0,sh);const tg=target(h);
const prev=S.habits.find(x=>x.id===h.after);
const dots=[6,5,4,3,2,1,0].map(i=>{const v=L[dk(ago(i))];return `<i class="${!v?'':v==='f'?'f':v==='m'?'m':'x'}"></i>`}).join('');
let x='';
if(prev&&!t&&pos((S.logs[prev.id]||{})[dk()]))x+=`<div class="nudge">Up next: you just did “${esc(prev.name)}”. Do this one now.</div>`;
if(!t&&!pos(L[dk(ago(1))])&&pos(L[dk(ago(2))]))x+=`<div class="nudge">You missed yesterday. Never miss twice: do the tiny version today.</div>`;
if(n===0&&!t&&(h.best||0)>2&&h.rd!==dk())x+=`<div class="nudge">Streak broke (best ${h.best}). <button class="g" onclick="reflect(${h.id})">Reflect &amp; restart</button></div>`;
const hc=S.col['h'+h.id];return `<div class="card"><div class="top" style="cursor:pointer" onclick="tg('h${h.id}')"><b>${hc?'▸':'▾'} ${esc(h.name)}</b><span class="s">${sh}🔥</span></div>${hc?'':`
<div class="m">${prev?'After “'+esc(prev.name)+'” · ':''}${h.link?'Auto from '+esc(h.link)+' sessions ('+(h.ln||1)+'/day) · ':''}${tg?'Target '+tg+' min · ':''}Best ${h.best}</div>${x}
<div class="row"><button class="g ${t==='f'?'on':''}" onclick="setLog(${h.id},'f')">✓ ${esc(h.full)}</button><button class="g ${t==='m'?'on':''}" onclick="setLog(${h.id},'m')">½ ${esc(h.min)}</button><button class="g ${t&&t[0]==='x'?'on':''}" onclick="open[${h.id}]=1;R()">Missed</button></div>
${open[h.id]?`<div class="row">${['Tired','Busy','Forgot','Unwell','Other'].map(r=>`<button class="g" onclick="setLog(${h.id},'x:${r}')">${r}</button>`).join('')}</div>`:''}
<div class="top"><div class="dots">${dots}</div><button class="g" style="padding:2px 8px" onclick="if(confirm('Delete this habit?'))delH(${h.id})">✕</button></div>`}</div>`}
function heat(){const n=S.habits.length,p=ago(83).getDay();let h='<i style="visibility:hidden"></i>'.repeat(p);for(let i=83;i>=0;i--){const k=dk(ago(i));let c=0;S.habits.forEach(x=>{if(pos((S.logs[x.id]||{})[k]))c++});h+=`<i style="${c&&n?'background:color-mix(in srgb,var(--acc) '+Math.round(25+75*c/n)+'%,var(--line))':''}"></i>`}return `<div class="hm">${h}</div>`}
const NAMES=['Starter','Builder','Steady','Disciplined','Relentless','Unshakeable'];
function habitsView(){const lv=Math.floor(Math.sqrt(S.points/25)),nx=25*(lv+1)**2,pv=25*lv*lv,nm=NAMES[Math.min(lv,5)];
const opts='<option value="">None</option>'+S.habits.map(h=>`<option value="${h.id}" ${D&&D.after===h.name?'selected':''}>${esc(h.name)}</option>`).join('');
return sec('idn','Identity & level',`<div class="card"><div class="m">I am someone who…</div><input type="text" value="${esc(S.identity)}" placeholder="studies a little every single day" onchange="S.identity=this.value;save()">
<div class="top" style="margin-top:10px"><span class="s">Level ${lv+1} · ${nm}</span><span class="m">${S.points} pts</span></div><div class="bar"><i style="width:${Math.min(100,(S.points-pv)/(nx-pv)*100)}%"></i></div></div>`)+sec('hb','My habits',`${S.habits.map(hCard).join('')||'<div class="card m c">No habits yet. Add your first below.</div>'}`)+quick()+sec('am','Add a habit manually',`<div class="card">
<div class="row"><input type="text" id="hn" list="tl" oninput="tfill(this.value)" placeholder="Habit name (start typing for suggestions)" value="${D?esc(D.n):''}"><datalist id="tl">${TPL.flatMap(c=>c.i).map(t=>`<option value="${esc(t.n)}">`).join('')}</datalist></div>
<div class="row"><input type="text" id="hf" placeholder="Full version (study 2 hours)" value="${D?esc(D.f):''}"></div>
<div class="row"><input type="text" id="hm" placeholder="Tiny fallback (open the book 5 min)" value="${D?esc(D.m):''}"></div>
<div class="row"><span class="m">After habit:</span><select id="ha">${opts}</select></div>
<div class="row"><span class="m">Auto-check from focus sessions of:</span><select id="hl"><option value="">None</option>${S.subjects.map(s=>`<option ${D&&D.link===s?'selected':''}>${esc(s)}</option>`).join('')}</select><input id="hk" type="number" min="1" value="${D&&D.ln||1}" style="width:64px"><span class="m">/day</span></div>
<div class="row"><span class="m">Ramp: start</span><input id="ht" type="number" min="0" placeholder="min" style="width:70px"><span class="m">+</span><input id="hs" type="number" min="1" value="5" style="width:64px"><span class="m">min/week</span></div>
<button class="b" onclick="addHabit()">Add habit</button></div>`,1)+sec('hmap','Last 12 weeks',`<div class="card">${heat()}</div>`)}

/* ---------- Timer logic ---------- */
function elapsed(){return T.tot-T.left}
function startF(){T={ph:'focus',run:true,tot:S.focus*60,left:S.focus*60,end:Date.now()+S.focus*60000,intr:0,lost:0,hid:0,tip:''};R()}
function pauseT(){if(T.run){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.run=false}else{T.end=Date.now()+T.left*1000;T.run=true}R()}
function logS(early){const min=early?Math.round(elapsed()/60):S.focus;if(early&&min<1)return null;const s={t:Date.now(),subj:S.subj,min,energy:S.energy,intent:S.intent,done:null,early:!!early,intr:T.intr,lost:Math.round(T.lost/1000)};if(early)s.done=0;S.sessions.push(s);save();return s}
function stopT(){if(T.ph==='focus'){logS(true);autoCheck()}T={ph:'idle',run:false,left:0,tot:0,intr:0,lost:0,hid:0,tip:''};$('#fm').style.display='none';R()}
const TIPS=['Stand up and stretch for two minutes.','Drink a glass of water.','Look at something 6 metres away for 20 seconds.','Take five slow breaths.','Walk to another room and back.','Roll your shoulders and relax your jaw.'];
function rate(v){const s=S.sessions[S.sessions.length-1];if(s)s.done=v;autoCheck();T={ph:'break',run:true,tot:S.brk*60,left:S.brk*60,end:Date.now()+S.brk*60000,intr:0,lost:0,hid:0,tip:TIPS[Math.floor(Math.random()*TIPS.length)]};save();R()}
function tick(){if(!T.run)return;T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));document.querySelectorAll('.clk').forEach(e=>e.textContent=fmt(T.left));if(T.left===0){beep();T.run=false;if(T.ph==='focus'){logS(false);T.ph='rate'}else T={ph:'idle',run:false,left:0,tot:0,intr:0,lost:0,hid:0,tip:''};$('#fm').style.display='none';R()}}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{if(T.ph==='focus'&&T.run){if(document.hidden)T.hid=Date.now();else if(T.hid){T.lost+=Date.now()-T.hid;T.intr++;T.hid=0;R()}}});
function advice(){const l=S.sessions.slice(-5);if(l.length>=4&&l.slice(-4).every(s=>!s.early&&s.done!==0&&s.min===S.focus)&&S.focus<60)return{d:5,m:`Your last 4 sessions went well. Try ${S.focus+5} minutes?`};if(l.length>=4&&l.filter(s=>s.early).length>=3&&S.focus>10)return{d:-5,m:`You’ve stopped early a lot lately. Try ${S.focus-5} minutes?`};return null}
function setFocus(d){S.focus=Math.max(5,Math.min(90,S.focus+d));save();R()}
function stats(){const k=dk(),td=S.sessions.filter(s=>dayOf(s)===k),m=td.reduce((a,s)=>a+s.min,0),by={};td.forEach(s=>by[s.subj]=(by[s.subj]||0)+s.min);
const rated=S.sessions.filter(s=>s.done!=null),cr=rated.length?Math.round(100*rated.reduce((a,s)=>a+s.done,0)/rated.length):null;
const en=[1,2,3].map(e=>{const r=rated.filter(s=>s.energy===e);return r.length?Math.round(100*r.reduce((a,s)=>a+s.done,0)/r.length)+'%':'–'});
const hr={};rated.forEach(s=>{const h=new Date(s.t).getHours();(hr[h]=hr[h]||[]).push(s.done)});
const best=Object.entries(hr).filter(e=>e[1].length>=2).map(e=>[+e[0],e[1].reduce((a,b)=>a+b,0)/e[1].length]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>(e[0]%12||12)+(e[0]<12?'am':'pm'));
return{m,n:td.length,by,cr,en,best}}
function focusView(){const st=stats(),A=advice(),run=T.ph==='focus'||T.ph==='break';
let main;
if(T.ph==='idle')main=`<div class="clk">${fmt(S.focus*60)}</div><div class="row" style="justify-content:center"><button class="b" onclick="startF()">Start focus</button></div>`;
else if(T.ph==='rate')main=`<p class="c"><b>Session done.</b> Did you finish what you planned?</p><div class="row" style="justify-content:center"><button class="b" onclick="rate(1)">Yes</button><button class="g" onclick="rate(.5)">Partly</button><button class="g" onclick="rate(0)">No</button></div>`;
else main=`<div class="m c">${T.ph==='focus'?esc(S.subj)+(S.intent?' · '+esc(S.intent):''):'Break'}</div><div class="clk">${fmt(T.left)}</div>${T.ph==='break'?`<div class="nudge">${T.tip}</div>`:''}
<div class="row" style="justify-content:center"><button class="b" onclick="pauseT()">${T.run?'Pause':'Resume'}</button><button class="g" onclick="stopT()">${T.ph==='focus'?'Stop':'Skip break'}</button>${T.ph==='focus'?`<button class="g" onclick="T.intr++;R()">Distracted</button><button class="g" onclick="$('#fmt').textContent=S.subj+(S.intent?' · '+S.intent:'');$('#fm').style.display='flex'">Focus mode</button>`:''}</div>
${T.ph==='focus'?`<div class="m c">Interruptions: ${T.intr}${T.lost?' · away '+fmt(Math.round(T.lost/1000))+' (lost focus time)':''}</div>`:''}`;
return sec('tm','Timer',`<div class="card">${T.ph==='idle'?`<div class="row"><select onchange="S.subj=this.value;save()">${S.subjects.map(s=>`<option ${s===S.subj?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="g" onclick="ask('New subject name',v=>{S.subjects.push(v);S.subj=v;save();R()})">+ Subject</button></div>
<div class="row"><span class="m">Energy now:</span>${[['Low',1],['Medium',2],['High',3]].map(e=>`<button class="g ${S.energy===e[1]?'on':''}" onclick="S.energy=${e[1]};save();R()">${e[0]}</button>`).join('')}</div>
<input type="text" placeholder="What will you finish this session?" value="${esc(S.intent)}" oninput="S.intent=this.value;save()">
<div class="row"><span class="m">Focus</span><button class="g" onclick="setFocus(-5)">−</button><b>${S.focus}</b><button class="g" onclick="setFocus(5)">+</button><span class="m">Break</span><button class="g" onclick="S.brk=Math.max(1,S.brk-1);save();R()">−</button><b>${S.brk}</b><button class="g" onclick="S.brk++;save();R()">+</button></div>
<div class="row"><button class="g" onclick="S.focus=25;S.brk=5;save();R()">25/5</button><button class="g" onclick="S.focus=50;S.brk=10;save();R()">50/10</button></div>
${A?`<div class="nudge">${A.m} <button class="g" onclick="setFocus(${A.d})">Apply</button></div>`:''}`:''}${main}</div>`)+sec('td','Today',`<div class="card"><div class="top"><span><b>${st.m}</b> min · ${st.n} sessions</span><span class="m">${Object.entries(st.by).map(e=>esc(e[0])+' '+e[1]).join(' · ')}</span></div>
<div class="m" style="margin-top:8px">Completion rate: ${st.cr==null?'–':st.cr+'%'} · by energy (low/med/high): ${st.en.join(' / ')}${st.best.length?'<br>Best focus hours: '+st.best.join(', '):''}</div></div>`)}

/* ---------- Review ---------- */
function reviewView(){const from=dk(ago(6)),ss=S.sessions.filter(s=>dayOf(s)>=from),mins=ss.reduce((a,s)=>a+s.min,0),rated=ss.filter(s=>s.done!=null),cr=rated.length?Math.round(100*rated.reduce((a,s)=>a+s.done,0)/rated.length):null,intr=ss.reduce((a,s)=>a+(s.intr||0),0),lost=Math.round(ss.reduce((a,s)=>a+(s.lost||0),0)/60);
const by={};ss.forEach(s=>by[s.subj]=(by[s.subj]||0)+s.min);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
let done=0,tot=0,why={},bestH=null;S.habits.forEach(h=>{const L=S.logs[h.id]||{};for(let i=0;i<7;i++){const v=L[dk(ago(i))];tot++;if(pos(v))done++;if(v&&v[0]==='x'){const r=v.slice(2);why[r]=(why[r]||0)+1}}const s=streak(h)+(h.carry||0);if(!bestH||s>bestH[1])bestH=[h.name,s]});
const hr=tot?Math.round(100*done/tot):null,blk=Object.entries(why).sort((a,b)=>b[1]-a[1])[0];
let tip='Keep going. Raise one habit target or add 5 minutes to your sessions.';
if(!ss.length&&!tot)tip='Log a few sessions and habit check-ins, then come back for your review.';
else if(blk&&blk[0]==='Tired')tip='Tiredness is your top blocker. Move hard sessions to your high-energy hours and use the tiny version on low days.';
else if(blk&&blk[0]==='Busy')tip='Busy days are costing you. Schedule habits right after something you already do, and lean on the tiny version.';
else if(blk&&blk[0]==='Forgot')tip='Forgetting is your top blocker. Stack habits after an existing one so there is a cue.';
else if(cr!=null&&cr<60)tip='Your completion rate is low. Plan smaller intentions per session or shorten the focus length.';
else if(hr!=null&&hr<50)tip='Habit consistency is under 50%. Use the tiny version until it feels automatic.';
const r=(a,b)=>`<div class="top" style="padding:3px 0"><span class="m">${a}</span><b>${b}</b></div>`;
return sec('r7','Last 7 days',`<div class="card">${r('Focus time',mins+' min · '+ss.length+' sessions')}${r('Completion rate',cr==null?'–':cr+'%')}${r('Top subject',top?esc(top[0])+' ('+top[1]+' min)':'–')}${r('Interruptions',intr+(lost?' · '+lost+' min lost':''))}${r('Habit check-ins',tot?done+' / '+tot+' ('+hr+'%)':'–')}${r('Longest streak',bestH?esc(bestH[0])+' ('+bestH[1]+')':'–')}${r('Top blocker',blk?blk[0]+' ('+blk[1]+'×)':'–')}</div>`)+sec('rt','One change for next week',`<div class="nudge">${tip}</div>`)+`
${S.refl.length?`<h2>Streak-break lessons</h2>${S.refl.slice(-3).reverse().map(x=>`<div class="card m">${new Date(x.t).toLocaleDateString()} · ${esc(x.v)}</div>`).join('')}`:''}
<div class="row"><button class="g" onclick="if(confirm('Erase all data?')){localStorage.removeItem('fh1');location.reload()}">Reset all data</button></div>`}

/* ---------- Guide ---------- */
const G1=`<div class="card"><ul>
<li><b>Pick a subject, set your energy, write one intention.</b> Be specific: “finish 10 MCQs”, not “study”.</li>
<li><b>Start focus.</b> Work until the timer ends. Pause only if you must; Stop logs a partial session.</li>
<li><b>Distracted:</b> tap it when you drift. Leaving the tab is detected automatically and the lost time is counted.</li>
<li><b>Focus mode</b> hides everything except the countdown and your task.</li>
<li><b>Rate the session</b> honestly (Yes / Partly / No). This builds your real completion rate.</li>
<li><b>Breaks</b> give you a 2-minute action. Do it instead of scrolling.</li>
<li><b>Adaptive timer:</b> after several easy sessions it suggests longer ones; after several early stops it suggests shorter ones. Tap Apply to accept.</li>
<li><b>Today</b> shows minutes per subject, completion by energy level, and your best focus hours (after a few rated sessions).</li></ul></div>`,G2=`<div class="card"><ul>
<li><b>Quick add:</b> pick a category (Study, Mindful, Health, Career, Daily), tap Add on a template, Edit to tweak it first, or add a whole routine at once. When adding manually, typing a name shows suggestions and fills in the rest.</li><li><b>Add a habit with two versions:</b> the full one and a tiny fallback. The tiny version (½) keeps your streak alive on bad days.</li>
<li><b>Stack:</b> choose an “after habit” and you’ll get an “Up next” prompt once that one is done.</li>
<li><b>Auto-check:</b> link a habit to a focus subject, e.g. “Study 3 sessions/day”, and it ticks itself.</li>
<li><b>Ramp:</b> set a starting minute target and weekly step. It rises only after a week with 5+ check-ins.</li>
<li><b>Missed?</b> Tap Missed and pick a reason. The Review tab shows your top blocker.</li>
<li><b>Never miss twice:</b> after one missed day you’ll see a warning to do the tiny version.</li>
<li><b>Streak broke?</b> Tap Reflect &amp; restart, write the lesson, and you restart near your best streak instead of zero.</li>
<li><b>Points &amp; identity:</b> full check-in = 10 pts, tiny = 5. Levels grow with points. Write your “I am someone who…” line.</li>
<li><b>Review tab:</b> a weekly summary with one suggested change. Check it every Sunday.</li></ul></div>
<div class="card m">Your data is saved in this browser only. Themes are in the top-right menu.</div>`;

/* ---------- Shell ---------- */
function R(){$('#nv').innerHTML=[['f','Focus'],['h','Habits'],['r','Review'],['g','Guide']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';R()">${t[1]}</button>`).join('');
const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.id!=='di')return;
$('#v').innerHTML=tab==='f'?focusView():tab==='h'?habitsView():tab==='r'?reviewView():sec('g1','Pomodoro: how to use it',G1)+sec('g2','Habits: how to use them',G2)}
apply();autoCheck();R();
</script></body></html>
